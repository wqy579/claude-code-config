<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Claude Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1115;--panel:#191c24;--me:#2f6fed;--ai:#242936;--txt:#e6e8ee;--dim:#8b93a7;--line:#2b3040}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-top:calc(12px + env(safe-area-inset-top))}
header .dot{width:8px;height:8px;border-radius:50%;background:#39d98a}
header .dot.busy{background:#f5b544;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
header b{font-size:15px}
header span{margin-left:auto;font-size:12px;color:var(--dim)}
button.ghost{background:transparent;color:var(--dim);font-size:12px;padding:5px 9px;border:1px solid var(--line);border-radius:8px;font-weight:400;cursor:pointer}
button.ghost:disabled{opacity:.4}
.hist{position:fixed;top:calc(env(safe-area-inset-top) + 48px);left:0;right:0;max-height:62vh;overflow-y:auto;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.45);z-index:20}
.hist.hidden{display:none}
.hist .item{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer}
.hist .item:active{background:#232939}
.hist .item .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .item .m{font-size:11px;color:var(--dim);display:flex;gap:10px}
.hist .item.active{background:#232939}
.hist .item.active .t{color:#9cc4ff}
.hist .empty{padding:22px 16px;color:var(--dim);font-size:13px;text-align:center}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.msg.me{align-self:flex-end;background:rgba(57,217,138,0.25);border:1px solid rgba(57,217,138,0.6);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--ai);border-bottom-left-radius:4px}
.msg.err{align-self:flex-start;background:#3a2028;border:1px solid #6b3140;color:#f0b6c0}
.msg pre{background:rgba(0,0,0,.35);padding:9px 11px;border-radius:8px;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:6px 0}
.msg code{font:12.5px ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}
.msg pre code{background:none;padding:0}
.msg strong{font-weight:700}
.msg em{font-style:italic}
.msg a{color:#7db4ff;text-decoration:underline}
.typing{position:fixed;bottom:70px;left:16px;background:#0d1117;border:1px solid #30363d;padding:8px 12px;border-radius:8px;display:flex;flex-direction:column;gap:5px;max-width:80%;box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:15;font-size:12px}
.typing .bar{display:flex;align-items:center;gap:6px;color:#8b949e}
.typing .bar .dots{display:flex;gap:3px;margin-left:4px}
.typing .bar .dots i{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:b 1.2s infinite}
.typing .progress-line{color:#8b949e;word-break:break-all;max-height:40px;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
.typing .partial-text{color:#c9d1d9;white-space:pre-wrap;word-break:break-word;max-height:120px;overflow-y:auto}
@keyframes b{30%{transform:translateY(-5px);opacity:.4}}
form{padding:10px 12px;background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:11px 13px;border-radius:10px;font-size:16px;outline:none}
input:focus{border-color:var(--me)}
button#btn{background:var(--me);color:#fff;border:none;padding:0 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
button#btn:disabled{opacity:.45}
button#btn.cancel{background:#c4453a}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <b>Claude Chat</b>
  <span id="sid">new</span>
  <button class="ghost" id="histbtn" type="button">历史</button>
  <button class="ghost" id="reset" type="button">新会话</button>
</header>
<div id="hist" class="hist hidden"></div>
<main id="main"></main>
<form id="form">
  <input id="in" type="text" placeholder="发消息给 Claude" autocomplete="off" enterkeyhint="send">
  <button id="btn" type="submit">发送</button>
</form>
<script>
const main=document.getElementById('main');
const inEl=document.getElementById('in');
const btn=document.getElementById('btn');
const form=document.getElementById('form');
const dot=document.getElementById('dot');
const sidEl=document.getElementById('sid');
const histEl=document.getElementById('hist');
const histBtn=document.getElementById('histbtn');
const resetBtn=document.getElementById('reset');

const LS_ACTIVE='cc_active_sid';
const LS_JOB='cc_job';
const POLL_MS=500;
const TIMEOUT_LIMIT=30*60*1000+30000;

let activeSid=null;
let busy=false;
let currentJobId=null;
let progressEl=null;
let pendingQueue=[];
let isCancelled=false;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v===null||v==='') localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function saveActive(){ lsSet(LS_ACTIVE, activeSid||null); }

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function md(s){
  let h=esc(s);
  h=h.replace(/```(\w+)?\n?([\s\S]*?)```/g,(m,l,c)=>'<pre><code>'+c+'</code></pre>');
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/^### (.+)$/gm,'<strong>$1</strong>');
  h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return h;
}
function scrollTop(){ main.scrollTop=main.scrollHeight; }
function clearMain(){ main.innerHTML=''; progressEl=null; }

function renderMsg(m){
  let cls='ai';
  if(m.role==='user') cls='me';
  else if(m.isError) cls='err';
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.innerHTML=md(m.text||'');
  main.appendChild(d);
  // 长按全选消息内容
  let pressTimer=null;
  d.addEventListener('touchstart',(e)=>{
    pressTimer=setTimeout(()=>{
      const range=document.createRange();
      range.selectNodeContents(d);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      pressTimer=null;
    },500);
  },{passive:true});
  d.addEventListener('touchend',()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  },{passive:true});
  d.addEventListener('touchmove',()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  },{passive:true});
  return d;
}

function add(text,cls){
  const d=document.createElement('div');
  d.className='msg '+(cls||'ai');
  d.innerHTML=md(text);
  main.appendChild(d);
  scrollTop();
  // 长按全选消息内容
  let pressTimer=null;
  d.addEventListener('touchstart',(e)=>{
    pressTimer=setTimeout(()=>{
      const range=document.createRange();
      range.selectNodeContents(d);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      pressTimer=null;
    },500);
  },{passive:true});
  d.addEventListener('touchend',()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  },{passive:true});
  d.addEventListener('touchmove',()=>{
    if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; }
  },{passive:true});
  return d;
}

function progress(show,info){
  if(show&&!progressEl){
    progressEl=document.createElement('div');
    progressEl.className='typing';
    progressEl.innerHTML='<div class="bar"><span class="label">处理中</span><span class="dots"><i></i><i></i><i></i></span></div><div class="progress-line"></div><div class="partial-text"></div>';
    document.body.appendChild(progressEl);
  }
  if(!show){ if(progressEl){ progressEl.remove(); progressEl=null; } return; }
  if(!progressEl||!info) return;
  const sec=Math.max(0,Math.round((Date.now()-info.start)/1000));
  progressEl.querySelector('.label').textContent=(info.current||'处理中')+' · '+sec+'s';
  progressEl.querySelector('.progress-line').textContent=(info.steps&&info.steps.length)
    ? info.steps.slice(-4).join(' -> ')
    : '';
  const partialEl=progressEl.querySelector('.partial-text');
  if(info.partialText){
    partialEl.textContent=info.partialText;
  }
}

async function fetchJSON(url,opts,retries){
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{
      const r=await fetch(url,Object.assign({cache:'no-store'},opts));
      if(r.ok) return {ok:true, data:await r.json()};
      const j=await r.json().catch(()=>({}));
      if(r.status>=500&&i<retries){ lastErr='HTTP '+r.status; continue; }
      return {ok:false, status:r.status, data:j};
    }catch(err){
      lastErr=err.name==='TimeoutError'?'超时':(err.message||'连接失败');
      if(i<retries) await new Promise(r=>setTimeout(r,1000*(i+1)));
    }
  }
  return {ok:false, data:{error:lastErr}};
}

async function loadSessionList(){
  const res=await fetchJSON('/api/sessions',null,1);
  return res.ok ? res.data : [];
}

async function loadSession(sid){
  const res=await fetchJSON('/api/session/'+sid,null,2);
  if(!res.ok) return false;
  clearMain();
  for(const m of res.data.messages) renderMsg(m);
  activeSid=res.data.sessionId;
  saveActive();
  sidEl.textContent='sid '+String(activeSid).slice(0,8);
  scrollTop();
  return true;
}

function timeAgo(ts){
  const d=Date.now()-ts;
  if(d<60000) return '刚刚';
  if(d<3600000) return Math.floor(d/60000)+'分钟前';
  if(d<86400000) return Math.floor(d/3600000)+'小时前';
  const t=new Date(ts);
  return (t.getMonth()+1)+'/'+t.getDate();
}

function renderHist(list){
  histEl.innerHTML='';
  if(!list.length){
    histEl.innerHTML='<div class="empty">还没有历史会话</div>';
    return;
  }
  for(const s of list){
    const it=document.createElement('div');
    it.className='item'+(s.sessionId===activeSid?' active':'');
    it.innerHTML='<div class="t"></div><div class="m"><span></span><span></span></div>';
    const tEl=it.querySelector('.t');
    const mSpans=it.querySelectorAll('.m span');
    tEl.textContent=s.title||'(空会话)';
    if(mSpans.length>0) mSpans[0].textContent=(s.count||0)+'条';
    if(mSpans.length>1) mSpans[1].textContent=timeAgo(s.updatedAt||0);
    it.addEventListener('click',async()=>{
      if(busy) return;
      toggleHist(false);
      await loadSession(s.sessionId);
      renderHist(await loadSessionList());
    });
    histEl.appendChild(it);
  }
}

function toggleHist(on){ histEl.classList.toggle('hidden',!on); }

histBtn.addEventListener('click',async()=>{
  if(busy){ toggleHist(false); return; }
  const willOpen=histEl.classList.contains('hidden');
  if(willOpen) renderHist(await loadSessionList());
  toggleHist(willOpen);
});

resetBtn.addEventListener('click',()=>{
  if(busy) return;
  activeSid=null;
  saveActive();
  sidEl.textContent='new';
  clearMain();
  toggleHist(false);
  add('新会话。上一轮上下文已断开。','ai');
});

function markBusy(){
  busy=true;
  btn.classList.add('cancel');
  dot.classList.add('busy');
  histBtn.disabled=true;
  resetBtn.disabled=true;
  updateBtnText();
}
function clearBusy(){
  busy=false;
  btn.classList.remove('cancel');
  dot.classList.remove('busy');
  histBtn.disabled=false;
  resetBtn.disabled=false;
  updateBtnText();
}
function updateBtnText(){
  btn.textContent=(busy&&inEl.value.trim()==='')?'取消':'发送';
}
inEl.addEventListener('input',updateBtnText);
function clearJob(){
  const wasCancelled=isCancelled;
  isCancelled=false;
  currentJobId=null;
  lsSet(LS_JOB,null);
  clearBusy();
  scrollTop();
  inEl.focus();
  // 发送队列中等待的消息（取消时不自动发送）
  if(pendingQueue.length>0&&!wasCancelled){
    const next=pendingQueue.shift();
    inEl.value=next;
    form.dispatchEvent(new Event('submit',{cancelable:true}));
  }
}

async function pollJob(jobId,start){
  const deadline=Date.now()+TIMEOUT_LIMIT;
  let miss=0;
  while(Date.now()<deadline){
    await new Promise(r=>setTimeout(r,POLL_MS));
    const res=await fetchJSON('/api/job/'+jobId,null,1);
    if(!res.ok){
      miss++;
      if(miss>=4) return {status:'error',error:'任务记录已过期（服务端可能重启过）'};
      progress(true,{current:'连接中断，重连中',steps:[],start:start});
      continue;
    }
    miss=0;
    const j=res.data;
    progress(true,{current:j.current,steps:j.steps,start:start,partialText:j.partialText});
    if(j.status==='done'||j.status==='error'||j.status==='cancelled') return j;
  }
  return {status:'error',error:'等待超时（服务端仍在处理）'};
}

async function applyResult(job){
  progress(false);
  if(job.status==='done'&&job.result){
    activeSid=job.result.sessionId||activeSid;
    saveActive();
    sidEl.textContent=activeSid?('sid '+String(activeSid).slice(0,8)):'new';
    if(activeSid) await loadSession(activeSid);
    renderHist(await loadSessionList());
  }else{
    if(activeSid) await loadSession(activeSid);
    add(job.status==='cancelled'?'已取消':('处理失败: '+(job.error||'未知错误')),'err');
  }
}

btn.addEventListener('click',async()=>{
  if(!busy||!currentJobId) return;
  isCancelled=true;
  await fetchJSON('/api/job/'+currentJobId,{method:'DELETE'});
  clearJob();
});

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  if(busy){
    const text=inEl.value.trim();
    if(text){
      pendingQueue.push(text);
      inEl.value='';
      add('(已排队等待)'+text,'ai');
    }
    return;
  }
  const text=inEl.value.trim();
  if(!text) return;
  markBusy();
  inEl.value='';
  add(text,'me');
  const start=Date.now();
  progress(true,{current:'提交中',steps:[],start:start});
  try{
    const submitted=await fetchJSON('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,sessionId:activeSid})
    },2);
    if(!submitted.ok){
      progress(false);
      add('提交失败: '+(submitted.data.error||submitted.status),'err');
      return;
    }
    currentJobId=submitted.data.jobId;
    lsSet(LS_JOB,JSON.stringify({id:currentJobId,start:start}));
    const job=await pollJob(currentJobId,start);
    await applyResult(job);
  }catch(err){
    progress(false);
    add('未知错误: '+(err.message||err),'err');
  }finally{
    clearJob();
  }
});

async function init(){
  const active=lsGet(LS_ACTIVE);
  const list=await loadSessionList();
  if(active&&list.some(s=>s.sessionId===active)){
    await loadSession(active);
  }else if(list.length){
    await loadSession(list[0].sessionId);
  }else{
    add('你好。我是 Claude，在 /workspace 里运行。支持多轮对话；刷新页面、关闭浏览器、换手机打开，历史都保存在服务端。点右上角「历史」切换旧会话。','ai');
  }
  scrollTop();
  await resumeJob();
}

async function resumeJob(){
  let saved=null;
  try{ saved=JSON.parse(lsGet(LS_JOB)||'null'); }catch(e){}
  if(!saved||!saved.id) return;
  const res=await fetchJSON('/api/job/'+saved.id,null,0);
  if(!res.ok){ lsSet(LS_JOB,null); return; }
  const j=res.data;
  if(j.status==='running'){
    markBusy();
    currentJobId=j.id;
    const done=await pollJob(j.id,saved.start||Date.now());
    await applyResult(done);
  }else if(j.status==='done'||j.status==='error'||j.status==='cancelled'){
    await applyResult(j);
  }
  clearJob();
}

init();
</script>
</body>
</html>
