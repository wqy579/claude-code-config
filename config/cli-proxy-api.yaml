config-version: 8
server:
  host: "0.0.0.0"
  port: 8317
access:
  api-keys:
    - "local-claude-code-key"
    - "x-api-key"
management:
  secret-key: "$2a$10$gO/jCWlnNBCGxcER58bzUOrei77SJJA05BnbdvQ3cB9sJll.07s7u"
  allow-remote: true
routing:
  retry:
    request-retry: 3
request-log: true
requests:
  timeout: 600s
  max-idle-conns: 1000
  max-idle-conns-per-host: 500
observability:
  logs:
    debug: true
    logging-to-file: true
    logs-max-total-size-mb: 50
    error-logs-max-files: 5
  usage:
    usage-statistics-enabled: true
    redis-usage-queue-retention-seconds: 86400
api-keys:
  openai-compatibility:
